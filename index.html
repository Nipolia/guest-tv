<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Guest Hockey</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  #stamp { color: #8b949e; font-size: 13px; margin-bottom: 14px; }
  h2 { font-size: 16px; margin: 18px 0 8px; color: #7ee0ff; }
  .feed { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 12px;
          background: #161b22; color: #e6edf3; border: 1px solid #30363d;
          border-radius: 8px; font-size: 15px; cursor: pointer; }
  .feed:hover, .feed:focus { border-color: #7ee0ff; outline: none; }
  .feed.dead { opacity: .45; text-decoration: line-through; }
  #playerwrap { margin: 10px 0 4px; display: none; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; }
  #now { font-size: 14px; color: #8b949e; margin-top: 6px; }
  #msg { color: #ffb86b; font-size: 14px; min-height: 18px; }
  .none { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
<h1>Guest Hockey</h1>
<div id="stamp">loading the latest list...</div>
<div id="msg"></div>
<div id="playerwrap">
  <video id="v" controls playsinline></video>
  <div id="now"></div>
</div>
<div id="list"></div>

<script>
var DATA_URL = null;
(function () {
  var m = /#d=([^&]+)/.exec(location.hash || "");
  if (m) DATA_URL = decodeURIComponent(m[1]);
})();

// Baked in by the updater at publish time; the fetch chain below is
// only a fallback for copies of this page served without data.
var EMBEDDED_DATA = {"generated": "2026-10-20T23:03:10.343355+00:00", "games": [{"title": "San Jose - Montr\u00e9al", "feeds": [{"name": "720p home", "url": "https://instreams.xyz/live3/F131/index.m3u8?st=WzMfOWVzYx98JIkDbArCBw&e=1792547185"}, {"name": "720p away", "url": "https://instreams.xyz/live3/F132/index.m3u8?st=KSCzJbaxYeLGnDwP9c9XYg&e=1792547208"}]}, {"title": "Colorado - New Jersey", "feeds": [{"name": "1080p away", "url": "https://instreams.live/live3/F134/index.m3u8?st=wqyhc7Dreo4OrMvpbglvXg&e=1792547253"}, {"name": "576p home", "url": "https://instreams.pro/live3/F133/index.m3u8?st=wVpu4JEIhTxWIYEcKC15AQ&e=1792547236"}]}, {"title": "Anaheim - NY", "feeds": [{"name": "720p home", "url": "https://instreams.live/live3/F135/index.m3u8?st=CvCXHBq9Eq2XyYn_6MgTeA&e=1792547267"}, {"name": "720p away", "url": "https://instreams.xyz/live3/F136/index.m3u8?st=J3_JiX6lMFNKKvkUTrvHDQ&e=1792547282"}]}, {"title": "Los Angeles - Washington", "feeds": [{"name": "1080p home", "url": "https://instreams.live/live3/F137/index.m3u8?st=IlxijVT2bXpe1Dlus5ZxrQ&e=1792547288"}, {"name": "1080p home", "url": "https://cdnlivetv.is/secure/api/v1/6a288d2a81d8192bb76cc35e/playlist.m3u8?token=NmEyODhkMmE4MWQ4MTkyYmI3NmNjMzVlOjE3OTI1NTA5MjQ5MTU6Y2RubGl2ZXR2LmlzOmRlN2Q2ZmZmYjEyN2RkMmUuYjZlYTY0YTFiNWZhODc4N2M0NWRkYmNhNGNhMWY5ZDliN2QwNjA4ZDczNTY5YTgwYjdiNmY4ZDliZTVjZDU3NQ"}]}, {"title": "Toronto - Columbus", "feeds": [{"name": "1080p home", "url": "https://gate4.st/live3/F138/index.m3u8?st=9gmf6MZIf30SoU_CPn5iiw&e=1792547336"}, {"name": "1080p away", "url": "https://instreams.xyz/live3/F139/index.m3u8?st=zPy5eqmfmUelJ9YyrNvxGw&e=1792547355"}]}]};

var video = document.getElementById('v');
var wrap = document.getElementById('playerwrap');
var nowEl = document.getElementById('now');
var msgEl = document.getElementById('msg');
var hls = null;
var currentBtn = null;

function fail(btn, feedName) {
  if (btn) { btn.classList.add('dead'); btn.disabled = true; }
  msgEl.textContent = 'That feed did not load. Try another one for this game.';
  nowEl.textContent = '';
  wrap.style.display = 'none';
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
}

function play(url, name, btn) {
  msgEl.textContent = '';
  wrap.style.display = 'block';
  currentBtn = btn;
  nowEl.textContent = 'Loading ' + name + ' ...';
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  var settled = false;
  var timer = setTimeout(function () {
    if (!settled) fail(btn, name);
  }, 20000);
  function ok() {
    settled = true;
    clearTimeout(timer);
    nowEl.textContent = 'Now playing: ' + name;
  }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () { ok(); video.play().catch(function(){}); });
    hls.on(Hls.Events.ERROR, function (ev, data) {
      if (data && data.fatal && !settled) { settled = true; clearTimeout(timer); fail(btn, name); }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', ok, { once: true });
    video.addEventListener('error', function () {
      if (!settled) { settled = true; clearTimeout(timer); fail(btn, name); }
    }, { once: true });
    video.play().catch(function(){});
  } else {
    clearTimeout(timer);
    fail(btn, name);
  }
  window.scrollTo(0, 0);
}

function render(data) {
  var stamp = document.getElementById('stamp');
  var when = data.generated ? new Date(data.generated) : null;
  stamp.textContent = 'List updated ' + (when ? when.toLocaleTimeString() : 'recently')
    + '. Feeds are checked before they are listed; if one stops working, pick another.';
  var list = document.getElementById('list');
  list.innerHTML = '';
  var games = data.games || [];
  if (!games.length) {
    list.innerHTML = '<p class="none">No guest feeds are available right now. '
      + 'Check back closer to puck drop.</p>';
    return;
  }
  games.forEach(function (g) {
    var h = document.createElement('h2');
    h.textContent = g.title;
    list.appendChild(h);
    (g.feeds || []).forEach(function (f) {
      var b = document.createElement('button');
      b.className = 'feed';
      b.textContent = f.name;
      b.onclick = function () { play(f.url, f.name, b); };
      list.appendChild(b);
    });
  });
}

function fetchJson(url) {
  return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
}

function showLoadError() {
  document.getElementById('stamp').textContent =
    'Could not load the list. Check your connection and refresh.';
}

function load() {
  if (DATA_URL) {
    fetchJson(DATA_URL).then(render).catch(showLoadError);
    return;
  }
  if (EMBEDDED_DATA) { render(EMBEDDED_DATA); return; }
  // Try plain CDN copies of the data file first (no API quota involved —
  // the unauthenticated GitHub API is rate-limited per IP and dies on
  // shared/NAT addresses), then fall back to commit-SHA discovery.
  var sources = [
    'https://cdn.jsdelivr.net/gh/Nipolia/guest-tv@main/data.json',
    'https://raw.githubusercontent.com/Nipolia/guest-tv/main/data.json',
    'https://rawcdn.githack.com/Nipolia/guest-tv/main/data.json'
  ];
  var i = 0;
  function next() {
    if (i >= sources.length) { discover(); return; }
    fetchJson(sources[i++])
      .then(function (d) {
        // An empty games list from a CDN copy is treated as a miss:
        // both CDNs have served stale empty copies while a fresher
        // source had the real list. Fall through and let the next
        // source (or SHA discovery) answer instead.
        if (!d || !d.games || !d.games.length) throw new Error('bad data');
        render(d);
      })
      .catch(next);
  }
  function discover() {
    fetch('https://api.github.com/repos/Nipolia/guest-tv/commits?per_page=1')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var sha = j && j[0] && j[0].sha;
        if (!sha) throw new Error('no sha');
        fetchJson('https://rawcdn.githack.com/Nipolia/guest-tv/' + sha + '/data.json')
          .then(render)
          .catch(showLoadError);
      })
      .catch(showLoadError);
  }
  next();
}
load();
setInterval(function () {
  // With baked-in data the freshest list is a fresh copy of this page
  // (served no-store); with fetched data just re-fetch.
  if (!DATA_URL && EMBEDDED_DATA) { location.reload(); } else { load(); }
}, 10 * 60 * 1000);
</script>
</body>
</html>
